<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>试卷预览 - 错了喵-错题管理</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <!-- 拼音库 -->
    <script>
        (function() {
            const cdns = [
                'https://cdn.jsdelivr.net/npm/pinyin-pro@3.19.6/dist/index.js',
                'https://unpkg.com/pinyin-pro@3.19.6/dist/index.js'
            ];
            let loaded = false, currentIndex = 0;
            function loadNextCDN() {
                if (loaded || currentIndex >= cdns.length) return;
                const script = document.createElement('script');
                script.src = cdns[currentIndex];
                script.onload = () => { loaded = true; console.log('✅ pinyin-pro 库加载成功'); };
                script.onerror = () => { currentIndex++; loadNextCDN(); };
                document.head.appendChild(script);
            }
            loadNextCDN();
        })();
    </script>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>👁️ 试卷预览</h1>
            <div>
                <a href="/" class="btn btn-secondary">← 返回首页</a>
                <button id="export-settings-toggle" onclick="toggleExportSettings()" class="btn btn-info">⚙️ 导出设置</button>
                <button onclick="addQuestion()" class="btn btn-success">➕ 添加题目</button>
                <button onclick="showExportModal()" class="btn btn-primary">📤 导出</button>
            </div>
        </div>

        <!-- 导出设置面板 -->
        <div id="export-settings-panel" class="card hidden">
            <div class="card-header">
                <h2 class="card-title">⚙️ 导出设置</h2>
                <div class="header-actions">
                    <button onclick="resetToDefault()" class="btn btn-secondary">重置默认</button>
                    <button onclick="saveSettings()" class="btn btn-primary">保存设置</button>
                </div>
            </div>
            <div class="card-body">
                <div class="settings-grid">
                    <!-- 字体设置 -->
                    <div class="settings-group">
                        <h3>📝 字体设置</h3>
                        <div class="form-group">
                            <label>标题字体大小</label>
                            <input type="number" id="title-size" min="12" max="36" value="16">
                        </div>
                        <div class="form-group">
                            <label>题号字体大小</label>
                            <input type="number" id="question-number-size" min="12" max="24" value="12">
                        </div>
                        <div class="form-group">
                            <label>正文字体大小</label>
                            <input type="number" id="text-size" min="10" max="20" value="12">
                        </div>
                    </div>

                    <!-- 图片设置 -->
                    <div class="settings-group">
                        <h3>🖼️ 图片设置</h3>
                        <div class="form-group">
                            <label>图片缩放比例</label>
                            <input type="number" id="image-scale" min="0.5" max="2" step="0.1" value="1.0">
                        </div>
                        <div class="form-group">
                            <label>图片宽度(英寸)</label>
                            <input type="number" id="image-width" min="2" max="8" step="0.5" value="5.0">
                        </div>
                    </div>

                    <!-- 间距设置 -->
                    <div class="settings-group">
                        <h3>📏 间距设置</h3>
                        <div class="form-group">
                            <label>题目后留白行数</label>
                            <input type="number" id="question-spacing" min="0" max="100" value="0">
                        </div>
                    </div>

                    <!-- 内容设置 -->
                    <div class="settings-group">
                        <h3>📄 内容设置</h3>
                        <div class="form-group">
                            <label>
                                <input type="checkbox" id="show-student-info" checked>
                                显示学生信息头部
                            </label>
                        </div>
                        <div class="form-group">
                            <label>
                                <input type="checkbox" id="show-question-text" checked>
                                显示题目文字内容
                            </label>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 试卷信息 -->
        <div class="card">
            <div class="card-header" style="display: flex; justify-content: space-between; align-items: center;">
                <h2 class="card-title" id="paper-name-title">📋 加载中...</h2>
                <button onclick="goToEditMode()" class="btn btn-warning" style="background: #ff9800;">✏️ 进入编辑模式</button>
            </div>
            <div id="paper-info">
                <p style="color: #7f8c8d; margin-top: 10px;">加载试卷信息...</p>
            </div>
        </div>

        <!-- 题目列表 -->
        <div class="card">
            <div class="card-header">
                <h2 class="card-title">题目列表</h2>
            </div>
            <div id="questions-list">
                <div style="text-align: center; padding: 40px; color: #7f8c8d;">
                    <div class="loading"></div>
                    <p style="margin-top: 10px;">加载题目...</p>
                </div>
            </div>
        </div>
    </div>

    <!-- 导出模态框 -->
    <div id="export-modal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h3>📤 导出错题</h3>
                <button onclick="closeExportModal()" class="btn btn-secondary">×</button>
            </div>
            <div class="modal-body">
                <div class="export-options">
                    <div class="export-option" onclick="showStudentSelector()">
                        <div class="export-icon">👤</div>
                        <div class="export-title">单个学生错题</div>
                        <div class="export-desc">选择一个学生，导出其错题Word文档</div>
                    </div>
                    <div class="export-option" onclick="exportAllStudents()">
                        <div class="export-icon">👥</div>
                        <div class="export-title">所有学生错题</div>
                        <div class="export-desc">导出所有学生的错题，打包成ZIP文件</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 选择学生模态框（全屏样式）-->
    <div id="student-select-modal" class="modal hidden">
        <div class="modal-content modal-fullscreen">
            <div class="modal-header">
                <h3>👤 选择学生（可多选）</h3>
                <button onclick="closeStudentSelectModal()" class="btn btn-secondary">×</button>
            </div>
            <div class="modal-body">
                <div id="export-student-selector"></div>
                <div class="form-actions" style="margin-top: 20px;">
                    <button onclick="closeStudentSelectModal()" class="btn btn-secondary">取消</button>
                    <button onclick="exportSelectedStudent()" class="btn btn-primary">📄 查看导出预览</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 编辑题目模态框 -->
    <div id="edit-question-modal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h3>✏️ 编辑题目</h3>
                <button onclick="closeEditModal()" class="btn btn-secondary">×</button>
            </div>
            <div class="modal-body">
                <form id="edit-question-form">
                    <input type="hidden" id="edit-question-id">
                    
                    <!-- 图片上传 -->
                    <div class="form-group">
                        <label class="form-label">题目截图</label>
                        <div id="edit-image-uploader"></div>
                    </div>

                    <!-- 错题学生选择 -->
                    <div class="form-group">
                        <label class="form-label">做错的学生</label>
                        <div id="edit-student-selector"></div>
                    </div>

                    <div class="form-actions">
                        <button type="button" onclick="closeEditModal()" class="btn btn-secondary">取消</button>
                        <button type="submit" class="btn btn-primary">保存修改</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="/static/js/utils.js"></script>
    <script>
        let paperId = null;
        let paper = null;
        let questions = [];
        let students = [];
        let exportStudentSelector = null;
        let editImageUploader = null;
        let editStudentSelector = null;
        let editingQuestion = null;

        // 页面加载完成后执行
        document.addEventListener('DOMContentLoaded', function() {
            // 从URL获取试卷ID
            paperId = window.location.pathname.split('/').pop();
            
            if (!paperId || isNaN(paperId)) {
                Utils.showError('无效的试卷ID');
                Utils.redirect('/');
                return;
            }

            loadData();
        });

        // 加载所有数据
        async function loadData() {
            try {
                // 并行加载数据
                const [paperData, questionsData, studentsData] = await Promise.all([
                    Utils.get(`/api/papers/${paperId}`),
                    Utils.get(`/api/questions/paper/${paperId}`),
                    Utils.get('/api/students/')
                ]);

                paper = paperData;
                questions = questionsData;
                students = studentsData;

                renderPaperInfo();
                renderQuestions();
                
                // 自动加载导出设置并显示面板
                await autoLoadExportSettings();
            } catch (error) {
                Utils.showError('加载数据失败: ' + error.message);
                Utils.redirect('/');
            }
        }

        // 渲染试卷信息
        function renderPaperInfo() {
            // 更新标题
            document.getElementById('paper-name-title').textContent = `📋 ${paper.name}`;
            // 更新信息
            document.getElementById('paper-info').innerHTML = `
                <p style="color: #7f8c8d; margin-top: 10px;">
                    试卷ID: ${paper.id} | 共 ${questions.length} 道题目
                </p>
            `;
        }

        // 渲染题目列表
        function renderQuestions() {
            const container = document.getElementById('questions-list');
            
            if (questions.length === 0) {
                container.innerHTML = `
                    <div style="text-align: center; padding: 40px; color: #7f8c8d;">
                        <p>📝 还没有题目</p>
                        <p style="font-size: 14px; margin-top: 10px;">点击"添加题目"开始添加</p>
                    </div>
                `;
                return;
            }

            let html = '';
            questions.forEach(question => {
                const wrongStudents = getWrongStudentsInfo(question.wrong_students);
                const imageUrls = question.image_urls ? question.image_urls.split(',') : [];
                
                html += `
                    <div class="question-item">
                        <div class="question-header">
                            <span class="question-number">第 ${question.question_no} 题</span>
                            <div class="question-actions">
                                <button onclick="toggleQuestionSettings(${question.id})" class="btn btn-secondary">⚙️ 单题设置</button>
                                <button onclick="editQuestion(${question.id})" class="btn btn-primary">✏️ 编辑</button>
                                <button onclick="deleteQuestion(${question.id})" class="btn btn-danger">🗑️ 删除</button>
                            </div>
                        </div>
                        
                        <!-- 单题设置面板 -->
                        <div id="question-settings-${question.id}" class="question-settings-panel hidden">
                            <div class="settings-panel-header">
                                <h4>第${question.question_no}题 - 个性化设置</h4>
                                <div class="settings-actions">
                                    <button onclick="resetQuestionSettings(${question.id})" class="btn btn-sm btn-secondary">重置为全局</button>
                                    <button onclick="saveQuestionSettings(${question.id})" class="btn btn-sm btn-primary">保存设置</button>
                                </div>
                            </div>
                            <div class="question-settings-content">
                                <div class="question-settings-grid">
                                    <div class="setting-group">
                                        <label>题号字体大小</label>
                                        <input type="number" id="q${question.id}-question-number-size" min="12" max="24" placeholder="继承全局" onchange="updateQuestionPreview(${question.id})">
                                    </div>
                                    <div class="setting-group">
                                        <label>正文字体大小</label>
                                        <input type="number" id="q${question.id}-text-size" min="10" max="20" placeholder="继承全局" onchange="updateQuestionPreview(${question.id})">
                                    </div>
                                    <div class="setting-group">
                                        <label>图片缩放比例</label>
                                        <input type="number" id="q${question.id}-image-scale" min="0.5" max="2" step="0.1" placeholder="继承全局" onchange="updateQuestionPreview(${question.id})">
                                    </div>
                                    <div class="setting-group">
                                        <label>图片宽度(英寸)</label>
                                        <input type="number" id="q${question.id}-image-width" min="2" max="8" step="0.5" placeholder="继承全局" onchange="updateQuestionPreview(${question.id})">
                                    </div>
                                    <div class="setting-group">
                                        <label>题目后留白行数</label>
                                        <input type="number" id="q${question.id}-question-spacing" min="0" max="100" placeholder="继承全局" onchange="updateQuestionPreview(${question.id})">
                                    </div>
                                    <div class="setting-group">
                                        <label>
                                            <input type="checkbox" id="q${question.id}-show-question-text" onchange="updateQuestionPreview(${question.id})">
                                            显示题目文字
                                        </label>
                                    </div>
                                </div>
                                <div class="question-preview-container">
                                    <h5>实时预览效果</h5>
                                    <div id="question-preview-${question.id}" class="question-preview">
                                        <!-- 预览内容将在这里动态生成 -->
                                    </div>
                                </div>
                            </div>
                        </div>
                        
                        <div class="question-content">
                            ${question.question_text ? `
                                <div class="question-text">
                                    <p>${question.question_text}</p>
                                </div>
                            ` : ''}
                            
                            <div class="question-images">
                                ${imageUrls.map(url => `
                                    <img src="${url.trim()}" alt="题目图片" class="question-image" onclick="viewImage('${url.trim()}')">
                                `).join('')}
                            </div>
                            
                            <div class="wrong-students">
                                <span class="wrong-students-label">错题学生：</span>
                                <div class="wrong-students-tags">
                                ${wrongStudents.length > 0 ? 
                                    wrongStudents.map(student => `
                                        <span class="wrong-student-badge" 
                                              data-question-id="${question.id}" 
                                              data-student-id="${student.id}" 
                                              title="${student.name}（${student.class_name}-${student.student_no}）- 点击查看该学生错题"
                                              onclick="viewStudentExport(${student.id})"
                                              style="cursor: pointer;">
                                            ${student.name}
                                            <span class="badge-remove" 
                                                  onclick="event.stopPropagation(); removeWrongStudent(${question.id}, ${student.id});"
                                                  title="移除该学生">×</span>
                                        </span>
                                    `).join('') :
                                    '<span class="no-wrong-students">暂无</span>'
                                }
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            });
            
            container.innerHTML = html;
        }

        // 获取错题学生信息
        function getWrongStudentsInfo(wrongStudentsString) {
            if (!wrongStudentsString) return [];
            
            const studentIds = wrongStudentsString.split(',')
                .map(id => parseInt(id.trim()))
                .filter(id => !isNaN(id));
            
            const result = students.filter(student => studentIds.includes(student.id));
            
            // 调试信息
            if (result.length > 0) {
                console.log('错题学生信息:', result);
            }
            
            return result;
        }

        // 显示试卷导出设置
        function showPaperExportPreview() {
            Utils.redirect(`/paper_export_preview/${paperId}`);
        }

        // 编辑题目
        async function editQuestion(questionId) {
            const question = questions.find(q => q.id === questionId);
            if (!question) return;

            editingQuestion = question;
            
            // 初始化编辑组件
            if (!editImageUploader) {
                const uploaderContainer = document.getElementById('edit-image-uploader');
                editImageUploader = new ImageUploader(uploaderContainer, {
                    multiple: true,
                    maxFiles: 10,
                    enableClipboard: true,
                    enableTextInput: true
                });
            }

            if (!editStudentSelector) {
                const selectorContainer = document.getElementById('edit-student-selector');
                editStudentSelector = new StudentSelector(selectorContainer, {
                    multiple: true,
                    searchable: true
                });
            }

            // 设置题目 ID
            document.getElementById('edit-question-id').value = questionId;
            
            // 加载既有数据（文字和图片）
            editImageUploader.loadExistingImages(
                question.image_urls || '', 
                question.question_text || ''
            );
            
            // 设置当前题目的错题学生
            const wrongStudentIds = question.wrong_students ? 
                question.wrong_students.split(',').map(id => parseInt(id.trim())).filter(id => !isNaN(id)) : 
                [];
            editStudentSelector.setSelectedStudents(wrongStudentIds);

            document.getElementById('edit-question-modal').classList.remove('hidden');
        }

        // 删除题目
        async function deleteQuestion(questionId) {
            const question = questions.find(q => q.id === questionId);
            if (!question) return;

            if (!Utils.confirm(`确定要删除第 ${question.question_no} 题吗？删除后无法恢复。`)) {
                return;
            }

            try {
                await Utils.delete(`/api/questions/${questionId}`);
                Utils.showSuccess('题目删除成功');
                loadData(); // 重新加载数据
            } catch (error) {
                Utils.showError('删除失败: ' + error.message);
            }
        }

        // 移除错题学生
        async function removeWrongStudent(questionId, studentId) {
            const question = questions.find(q => q.id === questionId);
            if (!question) return;
            
            // 获取当前错题学生列表
            const currentStudents = question.wrong_students ? 
                question.wrong_students.split(',').map(id => parseInt(id.trim())).filter(id => !isNaN(id)) : 
                [];
            
            // 移除指定学生
            const updatedStudents = currentStudents.filter(id => id !== studentId);
            
            try {
                await Utils.put(`/api/questions/${questionId}`, {
                    wrong_students: updatedStudents.join(',')
                });
                Utils.showSuccess('已移除该学生');
                loadData(); // 重新加载数据
            } catch (error) {
                Utils.showError('移除失败: ' + error.message);
            }
        }

        // 查看学生的导出预览
        function viewStudentExport(studentId) {
            Utils.redirect(`/export_preview/${paperId}/${studentId}`);
        }

        // 显示导出模态框
        function showExportModal() {
            document.getElementById('export-modal').classList.remove('hidden');
        }

        // 显示学生选择模态框
        function showStudentSelector() {
            // 关闭导出选项模态框
            closeExportModal();
            
            // 初始化学生选择器（如果还未初始化）
            if (!exportStudentSelector) {
                const container = document.getElementById('export-student-selector');
                exportStudentSelector = new StudentSelector(container, {
                    multiple: true,  // 改为支持多选
                    searchable: true
                });
            }
            
            // 清空之前的选择
            exportStudentSelector.setSelectedStudents([]);
            
            // 显示学生选择模态框
            document.getElementById('student-select-modal').classList.remove('hidden');
        }

        // 关闭学生选择模态框
        function closeStudentSelectModal() {
            document.getElementById('student-select-modal').classList.add('hidden');
        }

        // 导出选中学生的错题
        async function exportSelectedStudent() {
            const selectedStudents = exportStudentSelector.getSelectedStudents();
            if (selectedStudents.length === 0) {
                Utils.showError('请至少选择一个学生');
                return;
            }

            // 支持多个学生ID，用逗号分隔
            const studentIds = selectedStudents.join(',');
            // 跳转到导出预览页面
            Utils.redirect(`/export_preview/${paperId}/${studentIds}`);
        }

        // 导出所有学生错题
        async function exportAllStudents() {
            closeExportModal();
            
            if (!Utils.confirm('确定要导出所有学生的错题吗？这可能需要一些时间。')) {
                return;
            }

            try {
                Utils.showSuccess('正在生成所有学生的错题文档，请稍候...');
                
                const response = await Utils.post(`/api/export/all/${paperId}`);
                
                Utils.showSuccess('文档生成完成，即将开始下载...');
                
                // 下载ZIP文件
                setTimeout(() => {
                    Utils.downloadFile(response.download_url, `${paper.name}_错题集.zip`);
                }, 1000);
                
                closeExportModal();
            } catch (error) {
                Utils.showError('导出失败: ' + error.message);
            }
        }

        // 关闭导出模态框
        function closeExportModal() {
            document.getElementById('export-modal').classList.add('hidden');
        }

        // 关闭编辑模态框
        function closeEditModal() {
            document.getElementById('edit-question-modal').classList.add('hidden');
            editingQuestion = null;
        }

        // 导出设置相关功能
        let exportSettingsVisible = false;
        let currentSettings = null; // 存储当前完整设置

        // 自动加载导出设置（页面加载时调用）
        async function autoLoadExportSettings() {
            try {
                // 仅加载导出设置，不显示面板
                await loadExportSettings();
                
                console.log('✅ 导出设置已自动加载');
            } catch (error) {
                console.warn('⚠️ 自动加载导出设置失败:', error.message);
                // 不显示错误给用户，因为这不是关键功能
            }
        }

        // 更新导出设置按钮文字
        function updateExportSettingsButtonText() {
            const button = document.getElementById('export-settings-toggle');
            if (exportSettingsVisible) {
                button.innerHTML = '⚙️ 隐藏设置';
            } else {
                button.innerHTML = '⚙️ 导出设置';
            }
        }

        // 切换导出设置面板显示
        async function toggleExportSettings() {
            const panel = document.getElementById('export-settings-panel');
            
            if (exportSettingsVisible) {
                panel.classList.add('hidden');
                exportSettingsVisible = false;
            } else {
                // 如果设置还没加载过，先加载
                if (!currentSettings) {
                    await loadExportSettings();
                }
                panel.classList.remove('hidden');
                exportSettingsVisible = true;
            }
            
            // 更新按钮文字
            updateExportSettingsButtonText();
        }

        // 加载导出设置
        async function loadExportSettings() {
            try {
                const settings = await Utils.get(`/api/export/settings/${paperId}`);
                currentSettings = normalizeSettings(settings);
                
                // 填充全局设置表单
                document.getElementById('title-size').value = currentSettings.title_size || 16;
                document.getElementById('question-number-size').value = currentSettings.question_number_size || 12;
                document.getElementById('text-size').value = currentSettings.text_size || 12;
                document.getElementById('image-scale').value = currentSettings.image_scale || 1.0;
                document.getElementById('image-width').value = currentSettings.image_width || 5.0;
                document.getElementById('question-spacing').value = currentSettings.question_spacing || 0;
                document.getElementById('show-student-info').checked = currentSettings.show_student_info !== false;
                document.getElementById('show-question-text').checked = currentSettings.show_question_text !== false;
                
                // 加载所有单题设置
                loadAllQuestionSettings();
            } catch (error) {
                Utils.showError('加载设置失败: ' + error.message);
            }
        }

        // 加载所有单题设置
        function loadAllQuestionSettings() {
            if (!currentSettings || !questions) return;
            
            const overrides = currentSettings.question_overrides || {};
            
            questions.forEach(question => {
                const qid = question.id.toString();
                const questionOverride = overrides[qid] || {};
                
                // 填充单题设置表单
                const setValue = (fieldName, value) => {
                    const element = document.getElementById(`q${question.id}-${fieldName}`);
                    if (element) {
                        if (element.type === 'checkbox') {
                            element.checked = value !== undefined ? value : false;
                            element.indeterminate = value === undefined;
                        } else {
                            element.value = value !== undefined ? value : '';
                        }
                    }
                };
                
                setValue('question-number-size', questionOverride.question_number_size);
                setValue('text-size', questionOverride.text_size);
                setValue('image-scale', questionOverride.image_scale);
                setValue('image-width', questionOverride.image_width);
                setValue('question-spacing', questionOverride.question_spacing);
                setValue('show-question-text', questionOverride.show_question_text);
            });
        }

        // 加载单题设置时也更新预览
        function loadQuestionSettings(questionId) {
            if (!currentSettings) return;
            
            const overrides = currentSettings.question_overrides || {};
            const qid = questionId.toString();
            const questionOverride = overrides[qid] || {};
            
            // 填充该题的设置表单
            const setValue = (fieldName, value) => {
                const element = document.getElementById(`q${questionId}-${fieldName}`);
                if (element) {
                    if (element.type === 'checkbox') {
                        element.checked = value !== undefined ? value : currentSettings[fieldName.replace(/-/g, '_')] !== false;
                        element.indeterminate = value === undefined;
                    } else {
                        element.value = value !== undefined ? value : '';
                        element.placeholder = `继承全局(${currentSettings[fieldName.replace(/-/g, '_')] || '默认'})`;
                    }
                }
            };
            
            setValue('question-number-size', questionOverride.question_number_size);
            setValue('text-size', questionOverride.text_size);
            setValue('image-scale', questionOverride.image_scale);
            setValue('image-width', questionOverride.image_width);
            setValue('question-spacing', questionOverride.question_spacing);
            setValue('show-question-text', questionOverride.show_question_text);
            
            // 加载完设置后更新预览
            setTimeout(() => updateQuestionPreview(questionId), 50);
        }

        // 保存单题设置
        async function saveQuestionSettings(questionId) {
            try {
                if (!currentSettings) {
                    Utils.showError('请先加载全局设置');
                    return;
                }

                const qid = questionId.toString();
                const questionOverride = {};

                // 收集该题的设置值
                const getValue = (fieldName) => {
                    const element = document.getElementById(`q${questionId}-${fieldName}`);
                    if (element) {
                        if (element.type === 'checkbox') {
                            return element.indeterminate ? undefined : element.checked;
                        } else {
                            return element.value ? (isNaN(element.value) ? element.value : Number(element.value)) : undefined;
                        }
                    }
                    return undefined;
                };

                const fields = ['question-number-size', 'text-size', 'image-scale', 'image-width', 'question-spacing', 'show-question-text'];
                fields.forEach(field => {
                    const value = getValue(field);
                    if (value !== undefined) {
                        questionOverride[field.replace(/-/g, '_')] = value;
                    }
                });

                // 更新设置
                if (!currentSettings.question_overrides) {
                    currentSettings.question_overrides = {};
                }
                
                if (Object.keys(questionOverride).length > 0) {
                    currentSettings.question_overrides[qid] = questionOverride;
                } else {
                    delete currentSettings.question_overrides[qid];
                }

                // 保存到服务器
                await Utils.post(`/api/export/settings/${paperId}`, currentSettings);
                Utils.showSuccess(`第${getQuestionNo(questionId)}题设置保存成功`);
            } catch (error) {
                Utils.showError('保存单题设置失败: ' + error.message);
            }
        }

        // 重置单题设置为全局设置
        async function resetQuestionSettings(questionId) {
            if (!Utils.confirm('确定要重置该题的设置为全局设置吗？')) {
                return;
            }

            try {
                if (!currentSettings) {
                    Utils.showError('请先加载全局设置');
                    return;
                }

                const qid = questionId.toString();
                
                // 删除该题的覆盖设置
                if (currentSettings.question_overrides && currentSettings.question_overrides[qid]) {
                    delete currentSettings.question_overrides[qid];
                }

                // 保存到服务器
                await Utils.post(`/api/export/settings/${paperId}`, currentSettings);
                
                // 重新加载该题设置
                loadQuestionSettings(questionId);
                
                Utils.showSuccess(`第${getQuestionNo(questionId)}题设置已重置为全局设置`);
            } catch (error) {
                Utils.showError('重置单题设置失败: ' + error.message);
            }
        }

        // 获取题目编号的辅助函数
        function getQuestionNo(questionId) {
            const question = questions.find(q => q.id === questionId);
            return question ? question.question_no : questionId;
        }

        // 规范化设置对象中的字段名（处理可能的格式错误）
        function normalizeSettings(settings) {
            const normalized = { ...settings };
            
            // 修复可能的字段名错误
            if (normalized['question_number-size'] && !normalized['question_number_size']) {
                normalized['question_number_size'] = normalized['question_number-size'];
                delete normalized['question_number-size'];
            }
            
            // 处理question_overrides中的字段名错误
            if (normalized.question_overrides) {
                Object.keys(normalized.question_overrides).forEach(qid => {
                    const override = normalized.question_overrides[qid];
                    if (override['question_number-size'] && !override['question_number_size']) {
                        override['question_number_size'] = override['question_number-size'];
                        delete override['question_number-size'];
                    }
                });
            }
            
            return normalized;
        }

        // 更新单题预览
        function updateQuestionPreview(questionId) {
            if (!currentSettings) return;
            
            const question = questions.find(q => q.id === questionId);
            if (!question) return;
            
            // 获取该题的有效设置
            const qid = questionId.toString();
            const questionOverride = {};
            
            // 收集当前设置值
            const getValue = (fieldName) => {
                const element = document.getElementById(`q${questionId}-${fieldName}`);
                if (element) {
                    if (element.type === 'checkbox') {
                        return element.indeterminate ? undefined : element.checked;
                    } else {
                        return element.value ? Number(element.value) : undefined;
                    }
                }
                return undefined;
            };
            
            const fields = ['question-number-size', 'text-size', 'image-scale', 'image-width', 'question-spacing', 'show-question-text'];
            fields.forEach(field => {
                const value = getValue(field);
                if (value !== undefined) {
                    questionOverride[field.replace(/-/g, '_')] = value;
                }
            });
            
            // 合并设置
            const effectiveSettings = normalizeSettings({ ...currentSettings, ...questionOverride });
            
            // 生成预览HTML
            const previewHtml = generateQuestionPreviewHtml(question, effectiveSettings);
            
            // 更新预览区域
            const previewContainer = document.getElementById(`question-preview-${questionId}`);
            if (previewContainer) {
                previewContainer.innerHTML = previewHtml;
            }
        }

        // 生成题目预览HTML
        function generateQuestionPreviewHtml(question, settings) {
            const questionNumberSize = settings.question_number_size || 12;
            const textSize = settings.text_size || 12;
            const imageScale = settings.image_scale || 1.0;
            const imageWidth = (settings.image_width || 5.0) * imageScale;
            const questionSpacing = settings.question_spacing || 0;
            const showQuestionText = settings.show_question_text !== false;
            
            let html = `
                <div class="preview-document">
                    <div class="preview-question-title" style="font-size: ${questionNumberSize}pt; font-weight: bold; margin-bottom: 10px;">
                        第${question.question_no}题
                    </div>
            `;
            
            // 添加题目文字
            if (showQuestionText && question.question_text && question.question_text.trim()) {
                html += `
                    <div class="preview-question-text" style="font-size: ${textSize}pt; margin-bottom: 10px;">
                        ${question.question_text}
                    </div>
                `;
            }
            
            // 添加图片
            if (question.image_urls) {
                const imageUrls = question.image_urls.split(',').filter(url => url.trim());
                imageUrls.forEach(url => {
                    const cleanUrl = url.trim();
                    if (cleanUrl) {
                        html += `
                            <div class="preview-image" style="margin-bottom: 10px;">
                                <img src="${cleanUrl}" alt="题目图片" style="max-width: ${imageWidth * 72}px; width: auto; height: auto; border: 1px solid #ddd;">
                            </div>
                        `;
                    }
                });
            }
            
            // 添加留白
            if (questionSpacing > 0) {
                const spacingHeight = questionSpacing * 15; // 每行约15px
                html += `
                    <div class="preview-spacing" style="height: ${spacingHeight}px; border-left: 2px dashed #ccc; margin-left: 10px; position: relative;">
                        <span style="position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: #999; font-size: 11px;">
                            留白${questionSpacing}行
                        </span>
                    </div>
                `;
            }
            
            html += '</div>';
            return html;
        }

        // 切换单题设置面板时更新预览
        function toggleQuestionSettings(questionId) {
            const panel = document.getElementById(`question-settings-${questionId}`);
            if (panel.classList.contains('hidden')) {
                // 显示面板前先加载设置
                if (currentSettings) {
                    loadQuestionSettings(questionId);
                    setTimeout(() => updateQuestionPreview(questionId), 100);
                }
                panel.classList.remove('hidden');
            } else {
                panel.classList.add('hidden');
            }
        }

        // 保存导出设置
        async function saveSettings() {
            try {
                // 更新全局设置
                currentSettings = {
                    ...currentSettings,
                    title_size: parseInt(document.getElementById('title-size').value),
                    question_number_size: parseInt(document.getElementById('question-number-size').value),
                    text_size: parseInt(document.getElementById('text-size').value),
                    line_spacing: 1.5,
                    image_scale: parseFloat(document.getElementById('image-scale').value),
                    image_width: parseFloat(document.getElementById('image-width').value),
                    question_spacing: parseInt(document.getElementById('question-spacing').value),
                    show_student_info: document.getElementById('show-student-info').checked,
                    show_question_text: document.getElementById('show-question-text').checked,
                    question_overrides: currentSettings.question_overrides || {}
                };

                await Utils.post(`/api/export/settings/${paperId}`, currentSettings);
                Utils.showSuccess('全局设置保存成功');
                
                // 更新所有单题设置的占位符
                loadAllQuestionSettings();
            } catch (error) {
                Utils.showError('保存设置失败: ' + error.message);
            }
        }

        // 重置为默认设置
        function resetToDefault() {
            if (!Utils.confirm('确定要重置为默认设置吗？这将清除所有单题设置。')) {
                return;
            }

            document.getElementById('title-size').value = 16;
            document.getElementById('question-number-size').value = 12;
            document.getElementById('text-size').value = 12;
            document.getElementById('image-scale').value = 1.0;
            document.getElementById('image-width').value = 5.0;
            document.getElementById('question-spacing').value = 0;
            document.getElementById('show-student-info').checked = true;
            document.getElementById('show-question-text').checked = true;
            
            // 重置所有单题设置
            currentSettings = {
                title_size: 16,
                question_number_size: 12,
                text_size: 12,
                line_spacing: 1.5,
                image_scale: 1.0,
                image_width: 5.0,
                question_spacing: 0,
                show_student_info: true,
                show_question_text: true,
                question_overrides: {}
            };
            
            loadAllQuestionSettings();
        }

        // 添加题目
        function addQuestion() {
            Utils.redirect(`/add_question/${paperId}`);
        }

        // 进入编辑模式
        function goToEditMode() {
            Utils.redirect(`/question_edit.html?paper_id=${paperId}`);
        }

        // 查看图片
        function viewImage(imageUrl) {
            window.open(imageUrl, '_blank');
        }

        // 编辑表单提交
        document.getElementById('edit-question-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            if (!editingQuestion) return;

            const updateData = {};
            
            // 获取文字内容
            const textContent = editImageUploader.getTextContent();
            if (textContent !== undefined) {
                updateData.question_text = textContent;
            }
            
            // 获取图片URLs
            const imageUrls = editImageUploader.getUrls();
            if (imageUrls !== undefined) {
                updateData.image_urls = imageUrls;
            }
            
            // 获取错题学生
            updateData.wrong_students = editStudentSelector.getSelectedStudentsString();

            const submitBtn = e.target.querySelector('button[type="submit"]');
            const hideLoading = Utils.showLoading(submitBtn);

            try {
                await Utils.put(`/api/questions/${editingQuestion.id}`, updateData);
                Utils.showSuccess('题目更新成功');
                closeEditModal();
                loadData(); // 重新加载数据
            } catch (error) {
                Utils.showError('更新失败: ' + error.message);
            } finally {
                hideLoading();
            }
        });
    </script>
