<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学生管理 - 错了喵-错题管理</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <!-- 拼音库 -->
    <script src="/static/js/pinyin-pro.min.js"></script>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>👥 学生管理</h1>
            <div>
                <a href="/" class="btn btn-secondary">← 返回首页</a>
                <button onclick="showImportModal()" class="btn btn-info">📊 从Excel导入</button>
                <button onclick="addStudent()" class="btn btn-primary">➕ 添加学生</button>
            </div>
        </div>

        <!-- 筛选和搜索 -->
        <div class="card">
            <div class="form-group">
                <label class="form-label">筛选和搜索</label>
                <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                    <select id="class-filter" class="form-input" style="flex: 0 0 150px; min-width: 150px;">
                        <option value="">所有班级</option>
                    </select>
                    <input type="text" id="search-input" class="form-input" placeholder="搜索学号、姓名或拼音首字母..." style="flex: 1; min-width: 200px;">
                </div>
            </div>
        </div>

        <!-- 学生列表 -->
        <div class="card">
            <div class="card-header">
                <h2 class="card-title">学生列表</h2>
            </div>
            <div id="students-list">
                <div style="text-align: center; padding: 40px; color: #7f8c8d;">
                    <div class="loading"></div>
                    <p style="margin-top: 10px;">加载中...</p>
                </div>
            </div>
        </div>
    </div>

    <!-- 添加/编辑学生模态框 -->
    <div id="student-modal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modal-title">添加学生</h3>
                <button onclick="closeModal()" class="btn btn-secondary">×</button>
            </div>
            <div class="modal-body">
                <form id="student-form">
                    <input type="hidden" id="student-id" name="id">
                    <div class="form-group">
                        <label class="form-label">班级</label>
                        <input type="text" name="class_name" class="form-input" placeholder="请输入班级名称" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">学号</label>
                        <input type="text" name="student_no" class="form-input" placeholder="请输入学号" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">姓名</label>
                        <input type="text" name="name" class="form-input" placeholder="请输入学生姓名" required>
                    </div>
                    <div class="form-actions">
                        <button type="button" onclick="closeModal()" class="btn btn-secondary">取消</button>
                        <button type="submit" class="btn btn-primary">保存</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Excel导入模态框 -->
    <div id="import-modal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h3>📊 从Excel批量导入学生</h3>
                <button onclick="closeImportModal()" class="btn btn-secondary">×</button>
            </div>
            <div class="modal-body">
                <!-- 导入说明 -->
                <div class="import-guide">
                    <h4 style="color: #2c3e50; margin-bottom: 10px;">📋 Excel格式说明</h4>
                    <div class="guide-box">
                        <p style="margin: 5px 0;"><strong>固定列顺序：</strong></p>
                        <ul style="margin: 10px 0; padding-left: 20px;">
                            <li>第1列：<strong>班级</strong>（如：一班、二班）</li>
                            <li>第2列：<strong>学号</strong>（如：001、002）</li>
                            <li>第3列：<strong>姓名</strong>（如：张三、李四）</li>
                        </ul>
                        <p style="margin: 5px 0; color: #e67e22;"><strong>⚠️ 注意事项：</strong></p>
                        <ul style="margin: 10px 0; padding-left: 20px; color: #7f8c8d;">
                            <li>同班级同学号的学生会自动去重（保留第一个）</li>
                            <li>学号必须为数字或字母数字组合</li>
                            <li>班级、学号、姓名不能为空</li>
                            <li>支持 .xlsx 和 .xls 格式</li>
                        </ul>
                    </div>
                    
                    <!-- 示例表格 -->
                    <h4 style="color: #2c3e50; margin: 20px 0 10px 0;">📝 示例格式</h4>
                    <div class="example-table">
                        <table style="width: 100%; border-collapse: collapse; margin-bottom: 20px;">
                            <thead>
                                <tr style="background: #3498db; color: white;">
                                    <th style="padding: 10px; border: 1px solid #ddd;">班级</th>
                                    <th style="padding: 10px; border: 1px solid #ddd;">学号</th>
                                    <th style="padding: 10px; border: 1px solid #ddd;">姓名</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td style="padding: 10px; border: 1px solid #ddd;">一班</td>
                                    <td style="padding: 10px; border: 1px solid #ddd;">001</td>
                                    <td style="padding: 10px; border: 1px solid #ddd;">张三</td>
                                </tr>
                                <tr>
                                    <td style="padding: 10px; border: 1px solid #ddd;">一班</td>
                                    <td style="padding: 10px; border: 1px solid #ddd;">002</td>
                                    <td style="padding: 10px; border: 1px solid #ddd;">李四</td>
                                </tr>
                                <tr>
                                    <td style="padding: 10px; border: 1px solid #ddd;">二班</td>
                                    <td style="padding: 10px; border: 1px solid #ddd;">001</td>
                                    <td style="padding: 10px; border: 1px solid #ddd;">王五</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- 文件上传 -->
                <div class="form-group">
                    <label class="form-label">选择Excel文件</label>
                    <input type="file" id="excel-file" accept=".xlsx,.xls" class="form-input" style="padding: 10px;">
                </div>

                <!-- 导入结果 -->
                <div id="import-result" class="hidden" style="margin-top: 20px;">
                    <h4 style="color: #2c3e50; margin-bottom: 10px;">导入结果</h4>
                    <div id="import-summary" style="padding: 15px; background: #ecf0f1; border-radius: 4px; margin-bottom: 10px;"></div>
                    <div id="import-details" style="max-height: 200px; overflow-y: auto; padding: 10px; background: white; border: 1px solid #ddd; border-radius: 4px;"></div>
                </div>

                <div class="form-actions">
                    <button type="button" onclick="closeImportModal()" class="btn btn-secondary">取消</button>
                    <button type="button" onclick="importFromExcel()" class="btn btn-primary" id="import-btn">📥 开始导入</button>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/js/utils.js"></script>
    <!-- 引入 SheetJS 用于解析 Excel -->
    <script src="/static/js/xlsx.full.min.js"></script>
    <script>
        let students = [];
        let classes = [];
        let currentFilter = { class_name: '', search: '' };
        let editingStudent = null;

        // 拼音搜索工具（使用 pinyin-pro 库）
        const PinyinHelper = {
            // 匹配函数：支持中文、拼音全拼、拼音首字母
            matches: function(chinese, searchTerm) {
                if (!chinese || !searchTerm) return false;
                searchTerm = searchTerm.toLowerCase().trim();
                
                // 原字符匹配（始终可用）
                if (chinese.toLowerCase().includes(searchTerm)) return true;
                
                // 尝试使用 pinyin-pro 库
                try {
                    // 检查库是否加载
                    if (!window.pinyinPro) {
                        console.warn('pinyin-pro 库未加载');
                        return false;
                    }
                    
                    const { pinyin } = window.pinyinPro;
                    
                    // 全拼匹配（不带音调）
                    const fullPinyin = pinyin(chinese, { toneType: 'none' }).replace(/\s+/g, '').toLowerCase();
                    if (fullPinyin.includes(searchTerm)) return true;
                    
                    // 首字母匹配
                    const firstLetters = pinyin(chinese, { pattern: 'first', toneType: 'none' }).replace(/\s+/g, '').toLowerCase();
                    if (firstLetters.includes(searchTerm)) return true;
                    
                } catch (e) {
                    console.error('拼音转换失败:', e);
                }
                
                return false;
            }
        };

        // 页面加载完成后执行
        document.addEventListener('DOMContentLoaded', function() {
            loadStudents();
            loadClasses();
            bindEvents();
        });

        // 绑定事件
        function bindEvents() {
            // 班级筛选
            document.getElementById('class-filter').addEventListener('change', (e) => {
                currentFilter.class_name = e.target.value;
                filterAndRenderStudents();
            });

            // 搜索
            document.getElementById('search-input').addEventListener('input', Utils.debounce((e) => {
                currentFilter.search = e.target.value;
                filterAndRenderStudents();
            }, 300));
        }

        // 加载学生列表
        async function loadStudents() {
            try {
                students = await Utils.get('/api/students/');
                renderStudents();
            } catch (error) {
                Utils.showError('加载学生列表失败: ' + error.message);
                document.getElementById('students-list').innerHTML = `
                    <div style="text-align: center; padding: 40px; color: #e74c3c;">
                        <p>😞 加载失败</p>
                        <button onclick="loadStudents()" class="btn btn-primary" style="margin-top: 10px;">重新加载</button>
                    </div>
                `;
            }
        }

        // 加载班级列表
        async function loadClasses() {
            try {
                const response = await Utils.get('/api/students/classes');
                classes = response;
                renderClassFilter();
            } catch (error) {
                console.error('加载班级列表失败:', error);
            }
        }

        // 渲染班级筛选器
        function renderClassFilter() {
            const select = document.getElementById('class-filter');
            let html = '<option value="">所有班级</option>';
            
            classes.forEach(cls => {
                html += `<option value="${cls.class_name}">${cls.class_name}</option>`;
            });
            
            select.innerHTML = html;
        }

        // 筛选和渲染学生
        function filterAndRenderStudents() {
            let filteredStudents = students;

            // 班级筛选
            if (currentFilter.class_name) {
                filteredStudents = filteredStudents.filter(student => 
                    student.class_name === currentFilter.class_name
                );
            }

            // 搜索筛选（支持拼音）
            if (currentFilter.search) {
                const searchTerm = currentFilter.search.toLowerCase();
                filteredStudents = filteredStudents.filter(student => 
                    // 姓名匹配（支持拼音和首字母）
                    PinyinHelper.matches(student.name, searchTerm) ||
                    // 学号匹配
                    student.student_no.toLowerCase().includes(searchTerm) ||
                    // 班级匹配（支持拼音和首字母）
                    PinyinHelper.matches(student.class_name, searchTerm)
                );
            }

            renderStudents(filteredStudents);
        }

        // 渲染学生列表
        function renderStudents(studentsToRender = students) {
            const container = document.getElementById('students-list');
            
            if (studentsToRender.length === 0) {
                const message = currentFilter.class_name || currentFilter.search 
                    ? '没有找到符合条件的学生' 
                    : '还没有学生';
                    
                container.innerHTML = `
                    <div style="text-align: center; padding: 40px; color: #7f8c8d;">
                        <p>👤 ${message}</p>
                        ${!currentFilter.class_name && !currentFilter.search ? 
                            '<p style="font-size: 14px; margin-top: 10px;">点击"添加学生"开始添加</p>' : 
                            ''
                        }
                    </div>
                `;
                return;
            }

            let html = '';
            studentsToRender.forEach(student => {
                html += `
                    <div class="list-item">
                        <div>
                            <div class="list-item-title">${student.name}</div>
                            <div class="list-item-subtitle">${student.class_name} - ${student.student_no}</div>
                        </div>
                        <div>
                            <button onclick="editStudent(${student.id})" class="btn btn-primary">✏️ 编辑</button>
                            <button onclick="deleteStudent(${student.id})" class="btn btn-danger">🗑️ 删除</button>
                        </div>
                    </div>
                `;
            });
            
            container.innerHTML = html;
        }

        // 添加学生
        function addStudent() {
            editingStudent = null;
            document.getElementById('modal-title').textContent = '添加学生';
            document.getElementById('student-form').reset();
            document.getElementById('student-id').value = '';
            document.getElementById('student-modal').classList.remove('hidden');
        }

        // 编辑学生
        function editStudent(studentId) {
            const student = students.find(s => s.id === studentId);
            if (!student) return;

            editingStudent = student;
            document.getElementById('modal-title').textContent = '编辑学生';
            document.getElementById('student-id').value = student.id;
            document.querySelector('input[name="class_name"]').value = student.class_name;
            document.querySelector('input[name="student_no"]').value = student.student_no;
            document.querySelector('input[name="name"]').value = student.name;
            document.getElementById('student-modal').classList.remove('hidden');
        }

        // 删除学生
        async function deleteStudent(studentId) {
            const student = students.find(s => s.id === studentId);
            if (!student) return;

            if (!Utils.confirm(`确定要删除学生 ${student.name}(${student.student_no}) 吗？删除后无法恢复。`)) {
                return;
            }

            try {
                await Utils.delete(`/api/students/${studentId}`);
                Utils.showSuccess('学生删除成功');
                loadStudents();
                loadClasses(); // 重新加载班级列表
            } catch (error) {
                Utils.showError('删除失败: ' + error.message);
            }
        }

        // 关闭模态框
        function closeModal() {
            document.getElementById('student-modal').classList.add('hidden');
            document.getElementById('student-form').reset();
            editingStudent = null;
        }

        // 显示导入模态框
        function showImportModal() {
            document.getElementById('import-modal').classList.remove('hidden');
            document.getElementById('excel-file').value = '';
            document.getElementById('import-result').classList.add('hidden');
        }

        // 关闭导入模态框
        function closeImportModal() {
            document.getElementById('import-modal').classList.add('hidden');
            document.getElementById('excel-file').value = '';
            document.getElementById('import-result').classList.add('hidden');
        }

        // 从Excel导入
        async function importFromExcel() {
            const fileInput = document.getElementById('excel-file');
            const file = fileInput.files[0];
            
            if (!file) {
                Utils.showError('请选择Excel文件');
                return;
            }

            // 检查文件格式
            if (!file.name.match(/\.(xlsx|xls)$/i)) {
                Utils.showError('请选择Excel文件（.xlsx 或 .xls）');
                return;
            }

            const importBtn = document.getElementById('import-btn');
            const hideLoading = Utils.showLoading(importBtn);

            try {
                // 读取Excel文件
                const data = await readExcelFile(file);
                
                if (!data || data.length === 0) {
                    Utils.showError('Excel文件为空');
                    hideLoading();
                    return;
                }

                // 解析并验证数据
                const result = parseStudentData(data);
                
                if (result.validStudents.length === 0) {
                    Utils.showError('没有有效的学生数据');
                    hideLoading();
                    displayImportResult(result);
                    return;
                }

                // 批量导入学生
                const importResult = await batchImportStudents(result.validStudents);
                
                hideLoading();
                
                // 显示导入结果
                displayImportResult({
                    total: result.total,
                    validStudents: result.validStudents,
                    parseErrors: result.errors,
                    imported: importResult.success,
                    failed: importResult.failed,
                    duplicates: importResult.duplicates,
                    importErrors: importResult.errors
                });

                // 刷新学生列表
                if (importResult.success > 0) {
                    Utils.showSuccess(`成功导入 ${importResult.success} 名学生`);
                    await loadStudents();
                    await loadClasses();
                }

            } catch (error) {
                hideLoading();
                Utils.showError('导入失败: ' + error.message);
            }
        }

        // 读取Excel文件
        function readExcelFile(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                
                reader.onload = function(e) {
                    try {
                        const data = new Uint8Array(e.target.result);
                        const workbook = XLSX.read(data, { type: 'array' });
                        
                        // 读取第一个工作表
                        const firstSheetName = workbook.SheetNames[0];
                        const worksheet = workbook.Sheets[firstSheetName];
                        
                        // 转换为JSON
                        const jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1 });
                        
                        resolve(jsonData);
                    } catch (error) {
                        reject(new Error('Excel文件解析失败'));
                    }
                };
                
                reader.onerror = function() {
                    reject(new Error('文件读取失败'));
                };
                
                reader.readAsArrayBuffer(file);
            });
        }

        // 解析学生数据
        function parseStudentData(data) {
            const validStudents = [];
            const errors = [];
            const seen = new Set(); // 用于去重（班级-学号）

            // 从第1行开始（跳过表头如果有的话）
            for (let i = 0; i < data.length; i++) {
                const row = data[i];
                const rowNum = i + 1;

                // 跳过空行
                if (!row || row.length === 0 || !row[0]) {
                    continue;
                }

                const className = String(row[0] || '').trim();
                const studentNo = String(row[1] || '').trim();
                const name = String(row[2] || '').trim();

                // 验证数据
                if (!className) {
                    errors.push(`第${rowNum}行：班级不能为空`);
                    continue;
                }

                if (!studentNo) {
                    errors.push(`第${rowNum}行：学号不能为空`);
                    continue;
                }

                // 验证学号是否为有效字符（数字、字母、连字符）
                if (!/^[a-zA-Z0-9\-]+$/.test(studentNo)) {
                    errors.push(`第${rowNum}行：学号格式无效（${studentNo}）`);
                    continue;
                }

                if (!name) {
                    errors.push(`第${rowNum}行：姓名不能为空`);
                    continue;
                }

                // 去重检查（同班级同学号）
                const key = `${className}-${studentNo}`;
                if (seen.has(key)) {
                    errors.push(`第${rowNum}行：重复的学生（${className} - ${studentNo}）`);
                    continue;
                }

                seen.add(key);
                validStudents.push({
                    class_name: className,
                    student_no: studentNo,
                    name: name,
                    rowNum: rowNum
                });
            }

            return {
                total: data.length,
                validStudents: validStudents,
                errors: errors
            };
        }

        // 批量导入学生
        async function batchImportStudents(students) {
            let success = 0;
            let failed = 0;
            let duplicates = 0;
            const errors = [];

            for (const student of students) {
                try {
                    await Utils.post('/api/students/', {
                        class_name: student.class_name,
                        student_no: student.student_no,
                        name: student.name
                    });
                    success++;
                } catch (error) {
                    if (error.message && error.message.includes('已存在')) {
                        duplicates++;
                        errors.push(`第${student.rowNum}行：${student.name}(${student.student_no}) 已存在`);
                    } else {
                        failed++;
                        errors.push(`第${student.rowNum}行：${student.name} 导入失败 - ${error.message}`);
                    }
                }
            }

            return { success, failed, duplicates, errors };
        }

        // 显示导入结果
        function displayImportResult(result) {
            const resultDiv = document.getElementById('import-result');
            const summaryDiv = document.getElementById('import-summary');
            const detailsDiv = document.getElementById('import-details');

            // 汇总信息
            let summaryHtml = '<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px;">';
            
            if (result.total !== undefined) {
                summaryHtml += `<div><strong>读取行数：</strong>${result.total}</div>`;
            }
            if (result.validStudents) {
                summaryHtml += `<div><strong>有效数据：</strong>${result.validStudents.length}</div>`;
            }
            if (result.imported !== undefined) {
                summaryHtml += `<div style="color: #27ae60;"><strong>✅ 导入成功：</strong>${result.imported}</div>`;
            }
            if (result.duplicates !== undefined && result.duplicates > 0) {
                summaryHtml += `<div style="color: #f39c12;"><strong>⚠️ 已存在：</strong>${result.duplicates}</div>`;
            }
            if (result.failed !== undefined && result.failed > 0) {
                summaryHtml += `<div style="color: #e74c3c;"><strong>❌ 失败：</strong>${result.failed}</div>`;
            }
            
            summaryHtml += '</div>';
            summaryDiv.innerHTML = summaryHtml;

            // 详细错误信息
            let detailsHtml = '';
            
            // 收集所有错误
            const parseErrors = result.parseErrors || [];
            const importErrors = result.importErrors || [];
            const allErrors = [...parseErrors, ...importErrors];
            
            if (allErrors.length > 0) {
                detailsHtml = '<div style="color: #7f8c8d;"><strong>详细信息：</strong></div>';
                detailsHtml += '<ul style="margin: 5px 0; padding-left: 20px; font-size: 13px; color: #7f8c8d;">';
                allErrors.forEach(err => {
                    detailsHtml += `<li style="margin: 3px 0;">${err}</li>`;
                });
                detailsHtml += '</ul>';
            } else {
                detailsHtml = '<div style="color: #27ae60; font-size: 14px;">✅ 所有数据导入成功，没有错误</div>';
            }
            
            detailsDiv.innerHTML = detailsHtml;
            resultDiv.classList.remove('hidden');
        }

        // 表单提交
        document.getElementById('student-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const formData = new FormData(e.target);
            const studentData = {
                class_name: formData.get('class_name'),
                student_no: formData.get('student_no'),
                name: formData.get('name')
            };

            const submitBtn = e.target.querySelector('button[type="submit"]');
            const hideLoading = Utils.showLoading(submitBtn);

            try {
                if (editingStudent) {
                    // 编辑
                    await Utils.put(`/api/students/${editingStudent.id}`, studentData);
                    Utils.showSuccess('学生信息更新成功');
                } else {
                    // 添加
                    await Utils.post('/api/students/', studentData);
                    Utils.showSuccess('学生添加成功');
                }
                
                closeModal();
                loadStudents();
                loadClasses(); // 重新加载班级列表
            } catch (error) {
                Utils.showError('保存失败: ' + error.message);
            } finally {
                hideLoading();
            }
        });
    </script>

    <style>
        /* 模态框样式 */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
