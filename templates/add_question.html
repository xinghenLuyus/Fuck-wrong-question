<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>添加题目 - 错题管理系统</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <!-- 拼音库 -->
    <script>
        (function() {
            const cdns = [
                'https://cdn.jsdelivr.net/npm/pinyin-pro@3.19.6/dist/index.js',
                'https://unpkg.com/pinyin-pro@3.19.6/dist/index.js'
            ];
            let loaded = false, currentIndex = 0;
            function loadNextCDN() {
                if (loaded || currentIndex >= cdns.length) return;
                const script = document.createElement('script');
                script.src = cdns[currentIndex];
                script.onload = () => { loaded = true; console.log('✅ pinyin-pro 库加载成功'); };
                script.onerror = () => { currentIndex++; loadNextCDN(); };
                document.head.appendChild(script);
            }
            loadNextCDN();
        })();
    </script>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📝 添加题目</h1>
            <div>
                <a href="/" class="btn btn-secondary">← 返回首页</a>
                <button onclick="previewPaper()" class="btn btn-primary">👁️ 预览试卷</button>
            </div>
        </div>

        <!-- 试卷信息 -->
        <div class="card">
            <div id="paper-info">
                <div style="text-align: center; padding: 20px; color: #7f8c8d;">
                    <div class="loading"></div>
                    <p style="margin-top: 10px;">加载试卷信息...</p>
                </div>
            </div>
        </div>

        <!-- 添加题目表单 -->
        <div class="card">
            <div class="card-header">
                <h2 class="card-title">添加新题目</h2>
            </div>
            <form id="add-question-form">
                <!-- 图片上传和编辑 -->
                <div class="form-group">
                    <label class="form-label">题目截图和文字</label>
                    <div id="image-uploader"></div>
                    <div class="image-editor-note">
                        <p><strong>💡 图片编辑功能：</strong></p>
                        <ul>
                            <li>📋 支持剪切板粘贴图片（Ctrl+V）</li>
                            <li>✂️ 点击图片可进行裁剪编辑</li>
                            <li>✏️ 可直接输入题目文字</li>
                            <li>🔄 拖拽调整图片和文字顺序</li>
                        </ul>
                    </div>
                </div>

                <!-- 错题学生选择 -->
                <div class="form-group">
                    <label class="form-label">做错的学生（可选，也可以稍后在预览页面中添加）</label>
                    <div id="student-selector"></div>
                </div>

                <div class="form-actions">
                    <button type="button" onclick="cancelAdd()" class="btn btn-secondary">取消</button>
                    <button type="submit" class="btn btn-success">💾 保存题目</button>
                    <button type="button" onclick="saveAndContinue()" class="btn btn-primary">💾 保存并继续添加</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/static/js/utils.js"></script>
    <script>
        let paperId = null;
        let paper = null;
        let imageUploader = null;
        let studentSelector = null;
        let isSubmitting = false;

        // 页面加载完成后执行
        document.addEventListener('DOMContentLoaded', function() {
            // 从URL获取试卷ID
            paperId = window.location.pathname.split('/').pop();
            
            if (!paperId || isNaN(paperId)) {
                Utils.showError('无效的试卷ID');
                Utils.redirect('/');
                return;
            }

            loadPaper();
            initComponents();
            bindEvents();
        });

        // 加载试卷信息
        async function loadPaper() {
            try {
                paper = await Utils.get(`/api/papers/${paperId}`);
                renderPaperInfo();
            } catch (error) {
                Utils.showError('加载试卷信息失败: ' + error.message);
                Utils.redirect('/');
            }
        }

        // 渲染试卷信息
        async function renderPaperInfo() {
            try {
                // 获取当前试卷的题目数量
                const questions = await Utils.get(`/api/questions/paper/${paperId}`);
                const nextQuestionNo = questions.length + 1;
                
                document.getElementById('paper-info').innerHTML = `
                    <div class="card-header">
                        <h2 class="card-title">📋 ${paper.name}</h2>
                    </div>
                    <div class="paper-stats">
                        <div class="stat-item">
                            <span class="stat-label">试卷ID:</span>
                            <span class="stat-value">${paper.id}</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-label">当前题目数:</span>
                            <span class="stat-value">${questions.length} 道</span>
                        </div>
                        <div class="stat-item highlight">
                            <span class="stat-label">即将添加:</span>
                            <span class="stat-value">第 ${nextQuestionNo} 题</span>
                        </div>
                    </div>
                `;
            } catch (error) {
                // 如果获取题目失败，显示基本信息
                document.getElementById('paper-info').innerHTML = `
                    <div class="card-header">
                        <h2 class="card-title">📋 ${paper.name}</h2>
                    </div>
                    <p style="color: #7f8c8d; margin-top: 10px;">
                        试卷ID: ${paper.id} | 正在添加题目，系统将自动编号
                    </p>
                `;
            }
        }

        // 初始化组件
        function initComponents() {
            // 初始化图片上传器（支持文字输入和剪切板）
            const uploaderContainer = document.getElementById('image-uploader');
            imageUploader = new ImageUploader(uploaderContainer, {
                multiple: true,
                maxFiles: 10,
                enableClipboard: true,
                enableTextInput: true,
                paperId: paperId,  // 传递试卷ID，图片将保存到试卷专属文件夹
                onChange: (files) => {
                    console.log('上传的文件:', files);
                },
                onTextChange: (text) => {
                    console.log('文字内容:', text);
                }
            });

            // 初始化学生选择器
            const selectorContainer = document.getElementById('student-selector');
            studentSelector = new StudentSelector(selectorContainer, {
                multiple: true,
                searchable: true,
                onChange: (studentIds) => {
                    console.log('选择的学生:', studentIds);
                }
            });
        }

        // 绑定事件
        function bindEvents() {
            document.getElementById('add-question-form').addEventListener('submit', async function(e) {
                e.preventDefault();
                await saveQuestion();
            });
        }

        // 保存题目
        async function saveQuestion(continueAdd = false) {
            if (isSubmitting) return;

            const imageUrls = imageUploader.getUrls();
            const textContent = imageUploader.getTextContent();
            
            // 检查是否有内容（文字或图片）
            if (!imageUrls && !textContent.trim()) {
                Utils.showError('请输入题目文字或上传题目截图');
                return;
            }

            const questionData = {
                paper_id: parseInt(paperId),
                question_text: textContent.trim(),
                image_urls: imageUrls,
                wrong_students: studentSelector.getSelectedStudentsString()
            };

            isSubmitting = true;
            const submitBtn = document.querySelector('button[type="submit"]');
            const hideLoading = Utils.showLoading(submitBtn);

            try {
                await Utils.post('/api/questions/', questionData);
                Utils.showSuccess('题目保存成功');
                
                if (continueAdd) {
                    // 清空表单继续添加
                    imageUploader.clear();
                    studentSelector.setSelectedStudents([]);
                    // 更新题号显示
                    await renderPaperInfo();
                } else {
                    // 跳转到试卷预览
                    Utils.redirect(`/preview/${paperId}`);
                }
            } catch (error) {
                Utils.showError('保存失败: ' + error.message);
            } finally {
                hideLoading();
                isSubmitting = false;
            }
        }

        // 保存并继续添加
        async function saveAndContinue() {
            await saveQuestion(true);
        }

        // 取消添加
        function cancelAdd() {
            if (Utils.confirm('确定要取消添加题目吗？未保存的内容将丢失。')) {
                Utils.redirect('/');
            }
        }

        // 预览试卷
        function previewPaper() {
            Utils.redirect(`/preview/${paperId}`);
        }
    </script>

    <style>
        .form-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }

        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                gap: 15px;
            }
            
            .header div {
                display: flex;
                gap: 10px;
                width: 100%;
            }
            
            .header .btn {
                flex: 1;
            }
            
            .form-actions {
                flex-direction: column;
            }
            
            .form-actions .btn {
                width: 100%;
                margin-bottom: 10px;
            }
        }

        /* 自定义上传区域样式 */
        #image-uploader .upload-area {
            min-height: 200px;
        }

        /* 学生选择器样式优化 */
        #student-selector .student-selector {
            max-height: 300px;
        }

        /* 试卷统计信息样式 */
        .paper-stats {
            display: flex;
            gap: 20px;
            margin-top: 15px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
            border-left: 4px solid #3498db;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .stat-item.highlight {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 10px 15px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(102, 126, 234, 0.3);
        }

        .stat-label {
            font-size: 12px;
            color: #7f8c8d;
            margin-bottom: 4px;
            font-weight: 500;
        }

        .stat-item.highlight .stat-label {
            color: rgba(255, 255, 255, 0.8);
        }

        .stat-value {
            font-size: 16px;
            font-weight: 600;
            color: #2c3e50;
        }

        .stat-item.highlight .stat-value {
            color: white;
            font-size: 18px;
        }
    </style>
</body>
</html>
