<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>选择学生 - 错题管理系统</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <!-- 拼音库 -->
    <script>
        (function() {
            const cdns = [
                'https://cdn.jsdelivr.net/npm/pinyin-pro@3.19.6/dist/index.js',
                'https://unpkg.com/pinyin-pro@3.19.6/dist/index.js'
            ];
            let loaded = false, currentIndex = 0;
            function loadNextCDN() {
                if (loaded || currentIndex >= cdns.length) return;
                const script = document.createElement('script');
                script.src = cdns[currentIndex];
                script.onload = () => { loaded = true; console.log('✅ pinyin-pro 库加载成功'); };
                script.onerror = () => { currentIndex++; loadNextCDN(); };
                document.head.appendChild(script);
            }
            loadNextCDN();
        })();
    </script>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>👤 选择学生</h1>
            <div>
                <button onclick="goBack()" class="btn btn-secondary">← 返回</button>
            </div>
        </div>

        <!-- 学生选择器 -->
        <div class="card">
            <div class="card-header">
                <h2 class="card-title">请选择要导出错题的学生</h2>
            </div>
            <div style="padding: 20px;">
                <div id="student-selector"></div>
                
                <div class="form-actions" style="margin-top: 20px;">
                    <button onclick="goBack()" class="btn btn-secondary">取消</button>
                    <button onclick="confirmSelection()" class="btn btn-primary">📄 查看导出预览</button>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/js/utils.js"></script>
    <script>
        let paperId = null;
        let studentSelector = null;

        // 页面加载完成后执行
        document.addEventListener('DOMContentLoaded', function() {
            // 从URL获取试卷ID
            const pathParts = window.location.pathname.split('/');
            paperId = pathParts[pathParts.length - 1];
            
            if (!paperId || isNaN(paperId)) {
                Utils.showError('无效的试卷ID');
                Utils.redirect('/');
                return;
            }

            initStudentSelector();
        });

        // 初始化学生选择器
        function initStudentSelector() {
            const container = document.getElementById('student-selector');
            studentSelector = new StudentSelector(container, {
                multiple: false,
                searchable: true,
                onChange: (selectedIds) => {
                    // 实时更新确认按钮状态
                    const btn = document.querySelector('.btn-primary');
                    if (selectedIds.length > 0) {
                        btn.disabled = false;
                        btn.style.opacity = '1';
                    } else {
                        btn.disabled = true;
                        btn.style.opacity = '0.6';
                    }
                }
            });
        }

        // 确认选择
        function confirmSelection() {
            const selectedStudents = studentSelector.getSelectedStudents();
            if (selectedStudents.length === 0) {
                Utils.showError('请选择一个学生');
                return;
            }

            const studentId = selectedStudents[0];
            // 跳转到导出预览页面
            Utils.redirect(`/export_preview/${paperId}/${studentId}`);
        }

        // 返回
        function goBack() {
            Utils.redirect(`/preview/${paperId}`);
        }
    </script>

    <style>
        /* 页面特定样式 */
        .card-title {
            font-size: 16px;
            color: #2c3e50;
            margin: 0;
        }

        .form-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        .btn-primary:disabled {
            cursor: not-allowed;
            opacity: 0.6;
        }

        /* 增强学生选择器视觉 */
        #student-selector {
            min-height: 400px;
        }

        /* 移动端优化 */
        @media (max-width: 768px) {
            .form-actions {
                flex-direction: column;
            }
            
            .form-actions .btn {
                width: 100%;
            }
        }
    </style>
</body>
</html>
