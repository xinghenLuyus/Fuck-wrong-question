<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自动识别试卷 - 错题管理系统</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 自动识别试卷（测试版）</h1>
            <div>
                <a href="/" class="btn btn-secondary">← 返回首页</a>
                <button onclick="goToManualMode()" class="btn btn-info">✏️ 切换手动添加</button>
            </div>
        </div>

        <!-- 功能说明 -->
        <div class="card">
            <div class="card-header">
                <h2 class="card-title">📋 功能说明</h2>
            </div>
            <div class="card-body">
                <div class="feature-intro">
                    <div class="feature-item">
                        <span class="feature-icon">📄</span>
                        <div class="feature-text">
                            <strong>支持格式：</strong>Word文档(.docx)、PDF文档(.pdf)
                        </div>
                    </div>
                    <div class="feature-item">
                        <span class="feature-icon">✂️</span>
                        <div class="feature-text">
                            <strong>智能切分：</strong>自动识别题目边界，提取文本和图片
                        </div>
                    </div>
                    <div class="feature-item">
                        <span class="feature-icon">🎯</span>
                        <div class="feature-text">
                            <strong>支持模式：</strong>第1题、1.、(1)、一、等多种题号格式
                        </div>
                    </div>
                    <div class="feature-item">
                        <span class="feature-icon">⚠️</span>
                        <div class="feature-text">
                            <strong>注意：</strong>测试版功能，建议导入后检查并调整
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 文档上传区域 -->
        <div class="card">
            <div class="card-header">
                <h2 class="card-title">📁 上传文档</h2>
            </div>
            <div class="card-body">
                <!-- 切分方法选择 -->
                <div class="parse-method-selector">
                    <h3>🔧 选择解析方法</h3>
                    <div class="method-options">
                        <label class="method-option">
                            <input type="radio" name="split_method" value="auto" checked>
                            <div class="option-content">
                                <strong>🎯 智能自动</strong>
                                <span>自动选择最佳解析方法</span>
                            </div>
                        </label>
                        <label class="method-option">
                            <input type="radio" name="split_method" value="structure">
                            <div class="option-content">
                                <strong>📋 结构化解析</strong>
                                <span>基于文档原生结构</span>
                            </div>
                        </label>
                        <label class="method-option">
                            <input type="radio" name="split_method" value="visual">
                            <div class="option-content">
                                <strong>👁️ 视觉布局</strong>
                                <span>基于空白间距和位置</span>
                            </div>
                        </label>
                        <label class="method-option">
                            <input type="radio" name="split_method" value="smart">
                            <div class="option-content">
                                <strong>🧠 逻辑分析</strong>
                                <span>基于文本模式匹配</span>
                            </div>
                        </label>
                    </div>
                </div>
                
                <div class="upload-area" id="upload-area">
                    <div class="upload-content">
                        <div class="upload-icon">📁</div>
                        <p class="upload-text">拖拽文档到此处，或点击选择文件</p>
                        <p class="upload-hint">支持 Word(.docx) 和 PDF(.pdf) 格式，文件大小不超过10MB</p>
                        <input type="file" id="file-input" accept=".docx,.pdf" class="hidden">
                        <button onclick="selectFile()" class="btn btn-primary">选择文件</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 解析进度 -->
        <div id="parse-progress" class="card hidden">
            <div class="card-header">
                <h2 class="card-title">🔄 正在解析文档</h2>
            </div>
            <div class="card-body">
                <div class="progress-container">
                    <div class="progress-bar">
                        <div class="progress-fill" id="progress-fill"></div>
                    </div>
                    <p id="progress-text">准备解析...</p>
                </div>
            </div>
        </div>

        <!-- 解析结果预览 -->
        <div id="parse-results" class="card hidden">
            <div class="card-header">
                <h2 class="card-title">📝 解析结果预览</h2>
                <div class="header-actions">
                    <button onclick="reparse()" class="btn btn-secondary">🔄 重新解析</button>
                    <button onclick="editQuestions()" class="btn btn-info">✏️ 编辑调整</button>
                    <button onclick="confirmImport()" class="btn btn-success">✅ 确认导入</button>
                </div>
            </div>
            <div class="card-body">
                <div id="questions-preview"></div>
            </div>
        </div>
    </div>

    <script src="/static/js/utils.js"></script>
    <script>
        let paperId = null;
        let parsedQuestions = [];
        let uploadedFile = null;

        // 页面加载完成后执行
        document.addEventListener('DOMContentLoaded', function() {
            // 从URL获取试卷ID
            paperId = window.location.pathname.split('/').pop();
            
            if (!paperId || isNaN(paperId)) {
                Utils.showError('无效的试卷ID');
                Utils.redirect('/');
                return;
            }

            setupDragAndDrop();
            setupFileInput();
        });

        // 设置拖拽上传
        function setupDragAndDrop() {
            const uploadArea = document.getElementById('upload-area');
            
            uploadArea.addEventListener('dragover', (e) => {
                e.preventDefault();
                uploadArea.classList.add('drag-over');
            });
            
            uploadArea.addEventListener('dragleave', (e) => {
                e.preventDefault();
                uploadArea.classList.remove('drag-over');
            });
            
            uploadArea.addEventListener('drop', (e) => {
                e.preventDefault();
                uploadArea.classList.remove('drag-over');
                
                const files = e.dataTransfer.files;
                if (files.length > 0) {
                    handleFileSelect(files[0]);
                }
            });
        }

        // 设置文件输入
        function setupFileInput() {
            const fileInput = document.getElementById('file-input');
            fileInput.addEventListener('change', (e) => {
                if (e.target.files.length > 0) {
                    handleFileSelect(e.target.files[0]);
                }
            });
        }

        // 选择文件
        function selectFile() {
            document.getElementById('file-input').click();
        }

        // 处理文件选择
        function handleFileSelect(file) {
            // 验证文件类型
            const allowedTypes = ['.docx', '.pdf'];
            const fileName = file.name.toLowerCase();
            const isValidType = allowedTypes.some(type => fileName.endsWith(type));
            
            if (!isValidType) {
                Utils.showError('只支持Word(.docx)和PDF(.pdf)格式的文件');
                return;
            }
            
            // 验证文件大小
            const maxSize = 10 * 1024 * 1024; // 10MB
            if (file.size > maxSize) {
                Utils.showError('文件大小不能超过10MB');
                return;
            }
            
            uploadedFile = file;
            parseDocument();
        }

        // 解析文档
        async function parseDocument() {
            if (!uploadedFile) {
                Utils.showError('请先选择文件');
                return;
            }

            // 获取选中的解析方法
            const selectedMethod = document.querySelector('input[name="split_method"]:checked').value;

            // 显示进度
            showProgress();
            updateProgress(10, '正在上传文件...');

            try {
                const formData = new FormData();
                formData.append('file', uploadedFile);
                formData.append('paper_id', paperId);
                formData.append('split_method', selectedMethod);

                updateProgress(30, `正在使用${getMethodName(selectedMethod)}方法解析文档...`);

                const response = await fetch('/api/parse/document', {
                    method: 'POST',
                    body: formData
                });

                const result = await response.json();

                if (!response.ok) {
                    throw new Error(result.detail || '解析请求失败');
                }

                updateProgress(80, '正在处理题目...');
                
                // 检查解析是否成功
                if (result.success === false) {
                    // 解析失败，显示详细信息
                    hideProgress();
                    showParseFailureInfo(result);
                    return;
                }
                
                parsedQuestions = result.questions || [];
                
                updateProgress(100, '解析完成！');
                
                setTimeout(() => {
                    hideProgress();
                    showResults(result);
                }, 500);

            } catch (error) {
                hideProgress();
                Utils.showError('解析失败: ' + error.message);
            }
        }
        
        // 获取方法显示名称
        function getMethodName(method) {
            const names = {
                'auto': '智能自动',
                'structure': '结构化',
                'visual': '视觉布局',
                'smart': '逻辑分析'
            };
            return names[method] || '智能自动';
        }

        // 显示进度
        function showProgress() {
            document.getElementById('parse-progress').classList.remove('hidden');
            document.getElementById('parse-results').classList.add('hidden');
        }

        // 隐藏进度
        function hideProgress() {
            document.getElementById('parse-progress').classList.add('hidden');
        }

        // 更新进度
        function updateProgress(percent, text) {
            document.getElementById('progress-fill').style.width = percent + '%';
            document.getElementById('progress-text').textContent = text;
        }

        // 显示解析失败信息
        function showParseFailureInfo(result) {
            const parseResults = document.getElementById('parse-results');
            const questionsPreview = document.getElementById('questions-preview');
            
            let html = `
                <div class="parse-failure">
                    <div class="failure-header">
                        <div class="failure-icon">⚠️</div>
                        <h3>${result.message || '未识别到题目'}</h3>
                    </div>
                    
                    <div class="failure-content">
                        <div class="failure-section">
                            <h4>📋 建议解决方案：</h4>
                            <ul class="suggestions-list">
            `;
            
            if (result.suggestions && result.suggestions.length > 0) {
                result.suggestions.forEach(suggestion => {
                    html += `<li>${suggestion}</li>`;
                });
            } else {
                html += `
                    <li>请检查文档格式，确保题目有明确的编号（如1. 2. 3.）</li>
                    <li>或尝试手动添加题目</li>
                    <li>支持的题目格式：1. 题目内容、第1题、(1) 题目内容</li>
                `;
            }
            
            html += `
                            </ul>
                        </div>
                        
                        <div class="failure-section">
                            <h4>🔍 文档分析结果：</h4>
                            <div class="debug-info">
            `;
            
            if (result.debug_info) {
                html += `
                    <p><strong>文本段落：</strong> ${result.debug_info.text_elements} 个</p>
                    <p><strong>图片数量：</strong> ${result.debug_info.image_elements} 个</p>
                    <p><strong>文本总长度：</strong> ${result.debug_info.total_text_length} 字符</p>
                    <div class="sample-text">
                        <strong>文档内容预览：</strong>
                        <div class="text-preview">${result.debug_info.sample_text}</div>
                    </div>
                `;
            }
            
            html += `
                            </div>
                        </div>
                        
                        <div class="failure-actions">
                            <button onclick="reparse()" class="btn btn-primary">🔄 重新解析</button>
                            <button onclick="manualAdd()" class="btn btn-success">✏️ 手动添加题目</button>
                            <button onclick="goBack()" class="btn btn-secondary">← 返回首页</button>
                        </div>
                    </div>
                </div>
            `;
            
            questionsPreview.innerHTML = html;
            parseResults.classList.remove('hidden');
        }

        // 显示结果
        function showResults(result) {
            const container = document.getElementById('questions-preview');
            
            if (parsedQuestions.length === 0) {
                container.innerHTML = `
                    <div style="text-align: center; padding: 40px; color: #7f8c8d;">
                        <p>📝 未识别到题目</p>
                        <p style="font-size: 14px; margin-top: 10px;">请检查文档格式或尝试其他解析方法</p>
                    </div>
                `;
            } else {
                let html = `
                    <div class="results-summary">
                        <p>✅ 成功识别 <strong>${parsedQuestions.length}</strong> 道题目</p>
                        <div class="method-info">
                            <span class="method-badge">解析方法: ${getMethodName(result.split_method)}</span>
                            ${result.avg_confidence ? `<span class="confidence-badge">置信度: ${(result.avg_confidence * 100).toFixed(0)}%</span>` : ''}
                        </div>
                        <div class="batch-actions">
                            <p style="color: #666; font-size: 14px;">提示：如有需要，可在导入后手动编辑题目</p>
                        </div>
                    </div>
                    <div class="questions-list">
                `;
                
                parsedQuestions.forEach((question, index) => {
                    html += `
                        <div class="question-item">
                            <div class="question-header">
                                <h4>题目 ${question.question_no || index + 1}</h4>
                                <div class="question-actions">
                                    ${question.confidence ? `<span class="confidence-indicator" title="置信度">${(question.confidence * 100).toFixed(0)}%</span>` : ''}
                                    <button onclick="removeQuestion(${index})" class="btn btn-sm btn-danger">🗑️ 删除</button>
                                </div>
                            </div>
                            <div class="question-content">
                                <div class="question-text">
                                    <strong>文本内容：</strong>
                                    <div class="text-content">${question.question_text ? question.question_text.replace(/\n/g, '<br>') : '无文本内容'}</div>
                                </div>
                                ${question.image_urls && question.image_urls.length > 0 ? `
                                    <div class="question-images">
                                        <strong>图片内容：</strong>
                                        <div class="images-grid">
                                            ${question.image_urls.map(url => `
                                                <img src="${url}" alt="题目图片" class="question-image">
                                            `).join('')}
                                        </div>
                                    </div>
                                ` : ''}
                            </div>
                        </div>
                    `;
                });
                
                html += '</div>';
                container.innerHTML = html;
            }
            
            document.getElementById('parse-results').classList.remove('hidden');
        }

        // 重新解析
        function reparse() {
            if (uploadedFile) {
                parseDocument();
            } else {
                Utils.showError('请重新选择文件');
            }
        }

        // 重新编号所有题目
        function renumberQuestions() {
            parsedQuestions.forEach((question, index) => {
                question.question_no = index + 1;
            });
            showResults();
        }

        // 删除题目
        function removeQuestion(index) {
            if (confirm('确定要删除这道题目吗？')) {
                parsedQuestions.splice(index, 1);
                renumberQuestions();
            }
        }

        // 确认导入
        async function confirmImport() {
            if (parsedQuestions.length === 0) {
                Utils.showError('没有题目可导入');
                return;
            }

            const confirmMsg = `确定要导入 ${parsedQuestions.length} 道题目吗？`;
            if (!Utils.confirm(confirmMsg)) {
                return;
            }

            try {
                // 逐个导入题目
                for (let i = 0; i < parsedQuestions.length; i++) {
                    const question = parsedQuestions[i];
                    
                    await Utils.post('/api/questions/', {
                        paper_id: parseInt(paperId),
                        question_text: question.question_text || '',
                        image_urls: question.image_urls ? question.image_urls.join(',') : '',
                        wrong_students: ''
                    });
                }

                Utils.showSuccess(`成功导入 ${parsedQuestions.length} 道题目`);
                setTimeout(() => {
                    Utils.redirect(`/preview/${paperId}`);
                }, 1000);

            } catch (error) {
                Utils.showError('导入失败: ' + error.message);
            }
        }

        // 编辑调整
        function editQuestions() {
            Utils.showInfo('编辑功能开发中，您可以在导入后在预览页面进行编辑');
        }

        // 切换到手动模式
        function goToManualMode() {
            if (Utils.confirm('切换到手动添加模式？当前解析结果将丢失。')) {
                Utils.redirect(`/add_question/${paperId}`);
            }
        }

        // 手动添加题目
        function manualAdd() {
            Utils.redirect(`/add_question/${paperId}`);
        }

        // 返回首页
        function goBack() {
            Utils.redirect('/');
        }
    </script>
